<h2>Roster</h2>
<ul>
  <li *ngFor="let user of roster">
    {{ user.username }} - {{ user.email }}
  </li>
</ul>
<h2>Roster</h2>
<ul>
  <li *ngFor="let user of paginatedRoster">
    {{ user.username }} - {{ user.email }}
  </li>
</ul>

<!-- Pagination -->
<div *ngIf="roster.length > itemsPerPage">
  <button *ngFor="let page of [].constructor(Math.ceil(roster.length / itemsPerPage)); let i = index"
          (click)="changePage(i + 1)"
          [disabled]="currentPage === i + 1">
    {{ i + 1 }}
  </button>
</div>
